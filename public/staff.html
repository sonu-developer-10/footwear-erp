<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff & Salary Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; font-size: 13px; } .card { border-radius: 10px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }</style>
</head>
<body>
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">👥 Staff & Salary Management</h5>
            <a href="/admin" class="btn btn-dark btn-sm fw-bold">← Admin Panel</a>
        </div>

        <!-- Add Staff -->
        <div class="card p-3 mb-3">
            <h6 class="fw-bold">+ Naya Staff Add Karein</h6>
            <form id="staffForm" class="row g-2">
                <div class="col-md-3"><label>Staff Name</label><input type="text" id="stName" class="form-control form-control-sm" required></div>
                <div class="col-md-3"><label>Mobile No</label><input type="text" id="stPhone" class="form-control form-control-sm"></div>
                <div class="col-md-3"><label>Monthly Salary (₹)</label><input type="number" id="stSalary" class="form-control form-control-sm" required></div>
                <div class="col-md-2"><label>Joining Date</label><input type="date" id="stDate" class="form-control form-control-sm"></div>
                <div class="col-md-1 d-flex align-items-end"><button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">Save</button></div>
            </form>
        </div>

        <div class="row g-3 mb-3">
            <!-- Daily Attendance -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h6 class="fw-bold">📅 Daily Attendance (Haazri)</h6>
                    <form id="attForm" class="row g-2">
                        <div class="col-12"><label>Select Staff</label><select id="attStaff" class="form-select form-select-sm" required></select></div>
                        <div class="col-12"><label>Date</label><input type="date" id="attDate" class="form-control form-control-sm"></div>
                        <div class="col-12"><label>Status</label>
                            <select id="attStatus" class="form-select form-select-sm"><option>Present (P)</option><option>Half Day (HD)</option><option>Absent (A)</option></select>
                        </div>
                        <div class="col-12"><button type="submit" class="btn btn-success btn-sm w-100 fw-bold mt-2">Mark Haazri</button></div>
                    </form>
                </div>
            </div>

            <!-- Advance Kharcha -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h6 class="fw-bold">💸 Add Advance / Kharcha (Paise Diye)</h6>
                    <form id="advForm" class="row g-2">
                        <div class="col-12"><label>Select Staff</label><select id="advStaff" class="form-select form-select-sm" required></select></div>
                        <div class="col-12"><label>Date</label><input type="date" id="advDate" class="form-control form-control-sm"></div>
                        <div class="col-12"><label>Amount (₹)</label><input type="number" id="advAmt" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label>Note / Reason</label><input type="text" id="advNote" class="form-control form-control-sm" placeholder="Chai Paani / Emergency"></div>
                        <div class="col-12"><button type="submit" class="btn btn-warning btn-sm w-100 fw-bold mt-2 text-dark">Record Advance</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('stDate').valueAsDate = new Date();
        document.getElementById('attDate').valueAsDate = new Date();
        document.getElementById('advDate').valueAsDate = new Date();

        async function loadStaff() {
            const res = await fetch('/api/staff');
            const staff = await res.json();
            const opts = '<option value="">-- Select Staff --</option>' + staff.map(s => `<option value="${s.id}">${s.name} (₹${s.fixed_salary})</option>`).join('');
            document.getElementById('attStaff').innerHTML = opts;
            document.getElementById('advStaff').innerHTML = opts;
        }

        document.getElementById('staffForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/api/staff', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: stName.value, phone: stPhone.value, fixed_salary: stSalary.value, joining_date: stDate.value }) });
            e.target.reset(); loadStaff();
        };

        document.getElementById('attForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/api/attendance', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ staff_id: attStaff.value, date: attDate.value, status: attStatus.value }) });
            alert('Attendance Marked!');
        };

        document.getElementById('advForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/api/advance', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ staff_id: advStaff.value, date: advDate.value, amount: advAmt.value, notes: advNote.value }) });
            alert('Advance Saved!');
        };

        loadStaff();
    </script>
</body>
</html>
