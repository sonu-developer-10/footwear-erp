<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Mobile Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; padding: 12px; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e2e8f0; font-weight: bold; border-radius: 8px; color: #475569; font-size: 0.9rem; }
        .tab-btn.active { background: #2563eb; color: white; }
        .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        label { font-size: 0.8rem; font-weight: 700; color: #334155; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        .btn-green { background: #10b981; color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }
        .btn-blue { background: #2563eb; color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 15px;">
        <h2 style="color: #1e293b; font-size: 1.3rem;">👞 Footwear Staff Portal</h2>
        <small style="color: #64748b;">Billing & Attendance</small>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('att-tab', this)">✋ Haazri (Attendance)</button>
        <button class="tab-btn" onclick="switchTab('bill-tab', this)">🧾 Naya Bill</button>
    </div>

    <!-- TAB 1: ATTENDANCE -->
    <div id="att-tab" class="tab-content active">
        <div class="card">
            <h3 style="margin-bottom:10px; color:#0f172a;">Aaj Ki Attendance</h3>
            
            <label>Staff Select Karein</label>
            <select id="m_staff_select"><option value="">Loading staff...</option></select>

            <label>Tareekh (Date)</label>
            <input type="text" id="m_date" readonly style="background:#f8fafc;">

            <label>Status</label>
            <select id="m_status">
                <option value="Present">Present (P) - Poora Din</option>
                <option value="Half-Day">Half Day (HD)</option>
            </select>

            <button class="btn-green" onclick="submitAttendance()">Mark Present Now 📍</button>
        </div>
    </div>

    <!-- TAB 2: MOBILE BILLING -->
    <div id="bill-tab" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:10px; color:#0f172a;">Quick Wholesale Bill</h3>
            
            <label>Select Party / Customer</label>
            <input type="text" id="m_party" placeholder="Party Name Type Karein...">

            <label>Article No.</label>
            <input type="text" id="m_article" placeholder="e.g. 702 / Bounce">

            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>Peti (Carton)</label>
                    <input type="number" id="m_peti" placeholder="0" oninput="calcTotalPairs()">
                </div>
                <div style="flex:1;">
                    <label>Rate / Pair (₹)</label>
                    <input type="number" id="m_rate" placeholder="₹">
                </div>
            </div>

            <div style="background:#eff6ff; padding:10px; border-radius:8px; margin-top:12px; text-align:center;">
                <small style="color:#1d4ed8; font-weight:bold;">Total Pairs: <span id="m_total_pairs">0</span></small>
            </div>

            <button class="btn-blue" onclick="generateMobileBill()">Save & View Bill 🧾</button>
        </div>
    </div>

<script>
    // Tab Switcher
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // Set Today Date
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('m_date').value = today;

    // Fetch Staff List
    async function loadStaff() {
        try {
            const res = await fetch('/api/staff');
            const list = await res.json();
            const select = document.getElementById('m_staff_select');
            select.innerHTML = '<option value="">-- Apna Naam Chunen --</option>';
            list.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        } catch(e) {
            alert("Server Connect nahi ho raha!");
        }
    }

    // Submit Attendance
    async function submitAttendance() {
        const staff_id = document.getElementById('m_staff_select').value;
        const status = document.getElementById('m_status').value;

        if(!staff_id) return alert("Kripya apna naam chunaayein!");

        const res = await fetch('/api/self-attendance', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ staff_id, date: today, status })
        });

        const data = await res.json();
        if(res.ok) {
            alert(data.message);
        } else {
            alert(data.error || "Attendance fail ho gayi!");
        }
    }

    function calcTotalPairs() {
        const peti = document.getElementById('m_peti').value || 0;
        document.getElementById('m_total_pairs').innerText = peti * 12;
    }

    function generateMobileBill() {
        alert("Bill save ho gaya! Admin Panel par update ho jayega.");
    }

    loadStaff();
</script>
</body>
</html>
