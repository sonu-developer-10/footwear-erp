<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wholesale Billing & Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8fafc; font-size: 13px; } .card { border-radius: 10px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }</style>
</head>
<body>
    <div class="container my-4">
        <div class="card p-4 mb-4">
            <h5 class="fw-bold mb-3">🧾 Wholesale Billing & Invoice</h5>
            
            <div class="row g-3 mb-3">
                <div class="col-md-3"><label>BILL DATE</label><input type="date" id="bDate" class="form-control form-control-sm"></div>
                <div class="col-md-5"><label>SELECT WHOLESALE PARTY</label>
                    <select id="partySelect" class="form-select form-select-sm" onchange="updatePartyDue()"><option value="">-- Choose Party --</option></select>
                </div>
                <div class="col-md-4"><label>PREVIOUS BALANCE (₹)</label><input type="text" id="prevDue" class="form-control form-control-sm bg-light text-danger fw-bold" readonly value="0"></div>
                <div class="col-md-5"><label>DELIVERY MODE</label>
                    <select id="delMode" class="form-select form-select-sm"><option>Self Delivery (Personal Hand-Over)</option><option>Transport / E-Way</option></select>
                </div>
                <div class="col-md-7"><label>VEHICLE / DRIVER INFO (OPTIONAL)</label><input type="text" id="vInfo" class="form-control form-control-sm" placeholder="e.g. Scooter / Driver Name"></div>
            </div>

            <!-- Item Add Box -->
            <div class="p-3 bg-light rounded mb-3">
                <h6 class="fw-bold">Add Items to Bill:</h6>
                <div class="row g-2 align-items-end">
                    <div class="col-md-3"><label>SELECT ARTICLE</label><select id="itemSelect" class="form-select form-select-sm" onchange="autoFillItem()"><option value="">-- Choose Article --</option></select></div>
                    <div class="col-md-2">
    <label>SIZE RANGE</label>
    <select id="iSize" class="form-select form-select-sm">
        <option value="1*5">1*5 (Kids)</option>
        <option value="6*10">6*10 (Kids Med)</option>
        <option value="4*7">4*7 (Ladies)</option>
        <option value="5*8">5*8 (Ladies)</option>
        <option value="6*9" selected>6*9 (Gents)</option>
        <option value="7*10">7*10 (Gents)</option>
        <option value="11*13">11*13 (XL Gents)</option>
    </select>
</div>
                    <div class="col-md-2"><label>COLOR</label><input type="text" id="iColor" class="form-control form-control-sm"></div>
                    <div class="col-md-1"><label>MRP (₹)</label><input type="number" id="iMrp" class="form-control form-control-sm" value="0"></div>
                    <div class="col-md-1"><label>RATE/PR (₹)</label><input type="number" id="iRate" class="form-control form-control-sm" value="0"></div>
                    <div class="col-md-1"><label>CARTONS</label><input type="number" id="iCartons" class="form-control form-control-sm" value="0"></div>
                    <div class="col-md-1"><label>LOOSE PAIRS</label><input type="number" id="iLoose" class="form-control form-control-sm" value="0"></div>
                    <div class="col-md-1"><button onclick="addItem()" class="btn btn-success btn-sm w-100 fw-bold">+ Add</button></div>
                </div>
            </div>

            <!-- Bill Items Table -->
            <table class="table table-sm table-bordered text-center align-middle">
                <thead class="table-light"><tr><th>Article Code</th><th>Size</th><th>Color</th><th>MRP</th><th>Quantity</th><th>Total Pairs</th><th>Rate/Pr</th><th>Total Amount</th><th>Action</th></tr></thead>
                <tbody id="billItemsTable"></tbody>
            </table>

            <!-- Calculation Footer -->
            <div class="row g-3 my-2">
                <div class="col-md-4"><label>TODAY'S BILL TOTAL (₹)</label><input type="text" id="billTotal" class="form-control form-control-lg fw-bold" readonly value="0"></div>
                <div class="col-md-4"><label>AMOUNT PAID TODAY (JAMA) (₹)</label><input type="number" id="paidAmt" class="form-control form-control-lg fw-bold" value="0" oninput="calculateNetDue()"></div>
                <div class="col-md-4"><label>NET TOTAL REMAINING DUE (₹)</label><input type="text" id="netDue" class="form-control form-control-lg fw-bold text-danger" readonly value="0"></div>
            </div>

            <button onclick="saveBill()" class="btn btn-primary btn-lg w-100 fw-bold mt-2">Save & Generate Bill</button>
        </div>

        <!-- Recent Bills History -->
        <div class="card p-4">
            <h6 class="fw-bold mb-3">📜 Recent Bills History</h6>
            <table class="table table-sm table-bordered m-0">
                <thead class="table-light"><tr><th>Bill #</th><th>Date</th><th>Party Name</th><th>Bill Amount</th><th>Paid</th><th>Due Balance</th><th>Status</th></tr></thead>
                <tbody id="billHistoryTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('bDate').valueAsDate = new Date();
        let parties = [], articles = [], billItems = [];

        async function init() {
            parties = await (await fetch('/api/customers')).json();
            articles = await (await fetch('/api/articles')).json();
            
            document.getElementById('partySelect').innerHTML = '<option value="">-- Choose Party --</option>' + parties.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('itemSelect').innerHTML = '<option value="">-- Choose Article --</option>' + articles.map(a => `<option value="${a.article_no}">${a.article_no} -${a.brand}</option>`).join('');

            loadHistory();
        }

        function updatePartyDue() {
            const p = parties.find(x => x.id == partySelect.value);
            document.getElementById('prevDue').value = p ? p.previous_due : 0;
            calculateNetDue();
        }

        function autoFillItem() {
            const a = articles.find(x => x.article_no == itemSelect.value);
            if (a) {
                document.getElementById('iColor').value = a.color;
                document.getElementById('iMrp').value = a.mrp;
                document.getElementById('iRate').value = a.wholesale_rate;
            }
        }

        function addItem() {
            const code = itemSelect.value;
            const cartons = parseInt(iCartons.value) || 0;
            const loose = parseInt(iLoose.value) || 0;
            const totalPairs = (cartons * 12) + loose;
            const rate = parseFloat(iRate.value) || 0;
            const amt = totalPairs * rate;

            if (!code || totalPairs === 0) return alert('Select article and quantity!');

            billItems.push({ article_no: code, size: iSize.value, color: iColor.value, mrp: iMrp.value, qtyStr: `${cartons} Peti +${loose} Loose`, pairs: totalPairs, rate: rate, amount: amt });
            renderItems();
        }

        function renderItems() {
            let total = 0;
            document.getElementById('billItemsTable').innerHTML = billItems.map((item, index) => {
                total += item.amount;
                return `<tr><td>${item.article_no}</td><td>${item.size}</td><td>${item.color}</td><td>₹${item.mrp}</td><td>${item.qtyStr}</td><td class="fw-bold">${item.pairs}</td><td>₹${item.rate}</td><td class="fw-bold">₹${item.amount}</td><td><button class="btn btn-danger btn-sm py-0" onclick="billItems.splice(${index},1);renderItems();">X</button></td></tr>`;
            }).join('');
            
            document.getElementById('billTotal').value = total;
            calculateNetDue();
        }

        function calculateNetDue() {
            const prev = parseFloat(prevDue.value) || 0;
            const current = parseFloat(billTotal.value) || 0;
            const paid = parseFloat(paidAmt.value) || 0;
            document.getElementById('netDue').value = (prev + current) - paid;
        }

        async function saveBill() {
            const pId = partySelect.value;
            if (!pId || billItems.length === 0) return alert('Party aur items select karein!');

            const payload = {
                bill_date: bDate.value, customer_id: pId,
                customer_name: partySelect.options[partySelect.selectedIndex].text,
                delivery_mode: delMode.value, vehicle_no: vInfo.value,
                items: billItems, total_amount: parseFloat(billTotal.value),
                paid_amount: parseFloat(paidAmt.value), remaining_due: parseFloat(netDue.value)
            };

            await fetch('/api/wholesale-bill', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            alert('Bill Saved!');
            window.location.reload();
        }

        async function loadHistory() {
            const res = await fetch('/api/bills');
            const bills = await res.json();
            document.getElementById('billHistoryTable').innerHTML = bills.map(b => `<tr><td>#${b.id}</td><td>${b.bill_date}</td><td>${b.customer_name}</td><td>₹${b.total_amount}</td><td>₹${b.paid_amount}</td><td class="text-danger fw-bold">₹${b.remaining_due}</td><td><span class="badge bg-success">${b.status}</span></td></tr>`).join('');
        }

        init();
    </script>
</body>
</html>
